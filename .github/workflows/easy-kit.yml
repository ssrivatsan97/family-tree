# Builds the offline "Easy kit" zip from the latest code.
# Runs on every change to main, or by hand: Actions tab -> "Build Easy Kit" -> "Run workflow".
# Download: open the finished run -> "Artifacts" -> family-tree-easy-kit.
name: Build Easy Kit

on:
  workflow_dispatch:
  push:
    branches: [main]

# Read-only: this workflow can't change the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the kit
        run: node tools/build-easy-kit.mjs
      - name: Make it downloadable
        uses: actions/upload-artifact@v4
        with:
          name: family-tree-easy-kit
          path: dist/family-tree-easy-kit
          retention-days: 90
